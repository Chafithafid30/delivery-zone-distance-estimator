spring:
  application:
    name: delivery-zone
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery_zone}
    username: ${DB_USER:delivery}
    password: ${DB_PASSWORD:delivery_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  factory:
    latitude: ${FACTORY_LAT:-6.1751}
    longitude: ${FACTORY_LNG:106.8650}
  geocoding:
    mode: local
    remote-url: ${GEOCODING_SERVICE_URL:http://geocoder:8080}
    remote-timeout-seconds: 20
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:DeliveryZoneAssessment/1.0 (B-002 educational dispatch demo)}
    interval-ms: 1100
    timeout-seconds: 5
    cooldown-seconds: 30
