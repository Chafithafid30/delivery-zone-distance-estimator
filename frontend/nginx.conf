server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS is resolved at request time, including after service recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/ {
        set $backend_address backend:8080;
        proxy_pass http://$backend_address$request_uri;
        proxy_http_version 1.1;
        # Fresh upstream connections allow Swarm's VIP to distribute requests.
        proxy_set_header Connection close;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
