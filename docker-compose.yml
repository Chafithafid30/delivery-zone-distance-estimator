services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delivery_zone
      POSTGRES_USER: ${DB_USER:-delivery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-delivery_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - delivery_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d delivery_zone"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/delivery_zone
      DB_USER: ${DB_USER:-delivery}
      DB_PASSWORD: ${DB_PASSWORD:-delivery_dev}
      FACTORY_LAT: ${FACTORY_LAT:--6.1751}
      FACTORY_LNG: ${FACTORY_LNG:-106.8650}
      GEOCODING_BASE_URL: ${GEOCODING_BASE_URL:-https://nominatim.openstreetmap.org}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-DeliveryZoneAssessment/1.0 (B-002 educational dispatch demo)}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  delivery_data:
